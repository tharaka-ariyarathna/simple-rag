[pytest]
# src/ makes "import rag" work like running from src; . makes "from tests.fakes import ..." work
pythonpath = src .
testpaths = tests
# -ra lists every skipped test with its reason (e.g. integration tests without TEST_DATABASE_URL)
addopts = -ra
markers =
    integration: needs a real Postgres with pgvector (set TEST_DATABASE_URL)
